name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/bff[test]"
      - run: python -m unittest discover -s packages/bff/tests -t packages/bff
