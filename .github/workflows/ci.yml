name: ci

# Every action is pinned to the commit of a release, the release in the comment; every image a job runs is pinned to a
# digest, and every tool to a version. The routine that updates them: docs/guides/deploy.md ("Keep the pins current").

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces the older run; a run on main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bff:
    # The package declares ranges with security floors: the suite runs at the lowest versions the ranges allow
    # and at the newest, and pip-audit must find nothing in either installed set.
    name: bff (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.0 pip-audit==2.10.1
      - run: uv venv bff-venv
      - run: uv pip install --python bff-venv/bin/python --resolution ${{ matrix.resolution }} -e "packages/bff[test]"
      - run: bff-venv/bin/python -m unittest discover -s packages/bff/tests -t packages/bff
      - run: pip-audit --path bff-venv/lib/python3.12/site-packages

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run -w packages/ui lint
      - run: npm test -w packages/ui
      - run: npm run -w packages/ui build
      # The built theme is generated and committed, in its own folder: a change to the theme source without a rebuild
      # shows up as a diff here and fails.
      - run: npm run -w packages/ui theme:build
      - run: git diff --exit-code -- packages/ui/src/theme/built

  # K1: the template is built against the packages of this commit, not published ones, so it always proves that the
  # two packages work together.
  template-backend:
    name: template backend (this commit's BFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # What the template installs: its locked third-party packages, with hashes, and the BFF, which it pins to a commit
      # until its first release; here the workspace copy stands in for that pin.
      - run: pip install --require-hashes --no-deps -r template/backend/requirements.lock
      - run: pip install --no-deps -e packages/bff
      - run: python -m unittest discover -s template/backend/tests -t template/backend
      - run: python -m unittest discover -s template/stub-eneo
      # The lock is generated from the BFF's own requirements: a change to them without a new lock fails here. The
      # index's state is fixed by the date the lock records, and uv by its version, so the same command gives the same file.
      - run: pip install uv==0.13.0
      - run: |
          date="$(grep -o 'exclude-newer [^ ]*' template/backend/requirements.lock | cut -d' ' -f2)"
          uv pip compile packages/bff/pyproject.toml --python-version 3.12 --universal --generate-hashes \
            --exclude-newer "$date" -o template/backend/requirements.lock
          git diff --exit-code -- template/backend/requirements.lock

  template-audit:
    # The template's two locks, which every module starts from, against the known advisories, as a module's own `audit`
    # job checks them (template/.github/workflows/ci.yml): the backend's, and the web app's own (not the workspace's)
    # production dependencies, high and critical failing.
    name: template audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --requirement template/backend/requirements.lock --require-hashes --disable-pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high --workspaces=false
        working-directory: template/web

  template-web:
    # The browser tests in five parts, as a module's own CI runs them (template/.github/workflows/ci.yml): the module in
    # three browsers and the gate in Chromium (main), the tablets and a phone on its side (devices), the gate in WebKit
    # and in Firefox, and the production checks in each engine (prod). Together the five are every project of
    # template/web/tests/e2e/playwright.config.ts.
    name: template web ${{ matrix.part }} (this commit's UI and BFF)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            browsers: chromium webkit firefox
            projects: --project=chromium --project=webkit --project=firefox --project=phone-320-light --project=phone-390-light --project=phone-390-dark --project=laptop-1440-light --project=laptop-1440-dark --project=zoom-200 --project=forced-colors --project=reduced-motion
          - part: devices
            browsers: chromium
            projects: --project=tablet-portrait --project=tablet-landscape --project=landscape-844
          - part: webkit
            browsers: webkit
            projects: --project=phone-390-webkit --project=tablet-landscape-webkit --project=laptop-1440-webkit
          - part: firefox
            browsers: firefox
            projects: --project=laptop-1440-firefox
          - part: prod
            browsers: chromium webkit firefox
            projects: --project=prod-chromium --project=prod-webkit --project=prod-firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: pip install --require-hashes --no-deps -r template/backend/requirements.lock
      - run: pip install --no-deps -e packages/bff
      - run: npm ci
      - run: npm run -w packages/ui build
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      # Firefox runs Web Audio only with a sound server, which a runner has none of: one that plays into a sink of nothing
      # stands in for a computer's.
      - if: matrix.part == 'firefox'
        run: sudo apt-get install -y --no-install-recommends pulseaudio && pulseaudio --start --exit-idle-time=-1
      # Builds the template's app against the workspace UI package, serves it with the workspace BFF over the stub
      # Eneo, and runs the part's projects.
      - run: npm run -w template/web test:e2e -- ${{ matrix.projects }}
      # A failed run keeps Playwright's report and the trace of each failed test. `npm run -w template/web ci:failure`
      # finds them by the job's name up to its parenthesis, with `-results` after it (`template-web-main-results`), and
      # reads them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: template-web-${{ matrix.part }}-results
          path: template/web/test-results

  template-image:
    name: template image (this commit's UI and BFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run -w packages/ui build
      # The `kit` build context: the packed UI package and a copy of the BFF, which the Dockerfile uses in place of the
      # published ones.
      - run: |
          mkdir kit-context
          npm pack -w packages/ui --pack-destination kit-context
          cp -R packages/bff kit-context/bff
      # The compose files a module ships, with the example settings: alone (Dokploy), with the Traefik overlay and merged
      # with the development override. A fresh secret: the example's is a placeholder.
      - working-directory: template
        run: |
          sed "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env.example > .env
          docker compose -f docker-compose.yml config -q
          MODULE_HOST=modul.example.org ACME_EMAIL=it-drift@example.org docker compose -f docker-compose.yml -f docker-compose.traefik.yml config -q
          docker compose config -q
      # The image, built as a module's CI builds it, run as docker-compose.yml runs it (read-only, no capabilities) under
      # the name and the release tag the file pulls: it turns healthy and says its commit (its label and /health) and the
      # release the deployment names. The tag is this runner's alone; nothing is pushed.
      - working-directory: template
        run: |
          revision="$(git rev-parse HEAD)"
          export MODULE_VERSION=v0.0.0
          image="$(docker compose -f docker-compose.yml config --images)"
          docker build --build-context kit=../kit-context -t "$image" \
            --build-arg SOURCE_REVISION="$revision" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker compose -f docker-compose.yml up -d --wait || { docker compose -f docker-compose.yml logs; exit 1; }
          health="$(docker compose -f docker-compose.yml exec -T module python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:3001/health').read().decode())")"
          echo "$health"
          test "$(jq -r .revision <<< "$health")" = "$revision"
          test "$(jq -r .release <<< "$health")" = "$MODULE_VERSION"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$revision"

  workflows:
    # The kit's workflow and the two a module ships, which no run of this repository executes: actionlint, with
    # shellcheck on their scripts.
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml template/.github/workflows/ci.yml template/.github/workflows/release.yml
