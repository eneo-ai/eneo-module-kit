# Optional, for a host without a reverse proxy of its own: Traefik in front of the module, with HTTPS from Let's Encrypt.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Dokploy has its own Traefik and does not use this file: set the same read timeout and HSTS there (the kit's deploy
# guide, docs/guides/deploy.md). This file stands alone (its dynamic configuration is inline, below), and its variables
# come from .env: MODULE_HOST is the module's host name, MODULE_PUBLIC_URL must be https://<MODULE_HOST>, and ACME_EMAIL
# receives Let's Encrypt's notices about the certificate. Ports 80 and 443 must reach the host from the internet (the
# certificate's challenge is on 443).
#
# The static configuration is here as flags (compose fills in the variables) and the dynamic one, the module's route, as
# a file the file provider reads: no Docker socket is mounted into Traefik.
services:
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # The read timeout covers the whole request, its body included: Traefik's default of 60 s cuts every upload that
      # takes longer to send. 1800 s carries 1 GiB over 5 Mbit/s; recompute it when MAX_UPLOAD_BYTES or the slowest
      # connection the module promises changes. An upgraded connection (a WebSocket) has no limit. A write timeout of 0 is none.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=${PROXY_READ_TIMEOUT:-1800s}
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
      # No access log: the login's callback carries a one-time ticket in its address.
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    volumes:
      # The certificates outlive the container; without them Traefik asks for new ones at every start and reaches Let's
      # Encrypt's rate limit.
      - traefik-acme:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Not read_only: compose writes the inline configuration into the container, which a read-only root refuses. The rest
    # is locked down as the module is.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

configs:
  traefik_dynamic:
    content: |
      http:
        routers:
          module:
            entryPoints: [websecure]
            rule: Host(`${MODULE_HOST}`)
            service: module
            middlewares: [hsts]
            tls:
              certResolver: letsencrypt
        middlewares:
          # The module sets no HSTS itself: TLS ends here, so this is where browsers learn to come back over HTTPS only.
          hsts:
            headers:
              stsSeconds: 31536000
        services:
          module:
            loadBalancer:
              servers:
                - url: http://module:3001

volumes:
  traefik-acme:
