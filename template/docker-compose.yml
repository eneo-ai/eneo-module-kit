# The module as it runs in production: one service, one process, the published image, port 3001 on the compose network.
# Dokploy and a plain host run this file alone (`docker compose -f docker-compose.yml up -d`); docker-compose.override.yml
# is the developer's, and `docker compose up` merges it to build the image and start a stub Eneo instead. The settings
# come from .env, which .env.example lists.
#
# MODULE_VERSION chooses the image: a release tag vX.Y.Z, or latest. The same value goes into the container, so that
# /health says which release runs. The image's name is the module's one value to set here: ghcr.io/<owner>/<repository>
# of the module's own repository, which CI publishes to (its compose job fails until the two agree).
#
# The container is locked down as far as the module allows: a read-only root file system, no Linux capabilities, no new
# privileges. The image's own HEALTHCHECK asks /health.
services:
  module:
    image: ghcr.io/eneo-ai/eneo-module:${MODULE_VERSION:-latest}
    env_file: .env
    environment:
      # The tag above: only a tag vX.Y.Z is a release.
      MODULE_VERSION: ${MODULE_VERSION:-latest}
    volumes:
      # The one place the module writes: an upload waits here on its way to Eneo, on disk (a tmpfs would hold each
      # upload in memory). Size the disk for MAX_CONCURRENT_UPLOADS × MAX_UPLOAD_BYTES.
      - spool:/tmp
    expose:
      - "3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  spool:
